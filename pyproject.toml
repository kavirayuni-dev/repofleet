[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repofleet"
version = "0.1.0"
description = "Clone, update and keep a fleet of git repositories in sync from a single declarative config."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "multi-repo", "monorepo", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
repofleet = "repofleet.cli:main"

[project.urls]
Homepage = "https://dev.azure.com/creditsafe/Polaris"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repofleet = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
