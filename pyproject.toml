[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repofleet"
version = "0.2.1"
description = "Clone, update and keep a fleet of git repositories in sync from a single declarative config."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Srivathsa Kavirayuni", email = "kavirayuni.dev@gmail.com" }]
keywords = ["git", "multi-repo", "monorepo", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]

[project.scripts]
repofleet = "repofleet.cli:main"

[project.urls]
Homepage      = "https://github.com/kavirayuni-dev/repofleet"
Documentation = "https://github.com/kavirayuni-dev/repofleet#readme"
"Usage Guide" = "https://github.com/kavirayuni-dev/repofleet/blob/main/docs/USAGE.md"
"Team Wiki"   = "https://github.com/kavirayuni-dev/repofleet/blob/main/docs/WIKI.md"
Source        = "https://github.com/kavirayuni-dev/repofleet"
Repository    = "https://github.com/kavirayuni-dev/repofleet"
Issues        = "https://github.com/kavirayuni-dev/repofleet/issues"
Changelog     = "https://github.com/kavirayuni-dev/repofleet/blob/main/CHANGELOG.md"
Releases      = "https://github.com/kavirayuni-dev/repofleet/releases"
"CI Status"   = "https://github.com/kavirayuni-dev/repofleet/actions"
Publishing    = "https://github.com/kavirayuni-dev/repofleet/blob/main/docs/PUBLISHING.md"
"PyPI Page"   = "https://pypi.org/project/repofleet/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repofleet = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
