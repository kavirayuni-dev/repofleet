# repofleet profile: Polaris "Portfolios Backend" services.
#
# Usage:
#   repofleet sync -c polaris-portfolios.toml
# Copy this file next to where you want the repos and run 'repofleet sync'.
# With root = "auto" the repos land in ./Portfolios Backend unless the folder
# holding this file already contains portfolios.* checkouts.

[workspace]
name = "Portfolios Backend"
# root: "auto" keeps repos next to this file when some already exist,
# otherwise they are cloned into the 'directory' below.
root = "auto"
directory = "Portfolios Backend"
match = ["portfolios.*"]
remote = "origin"

[defaults]
stash = true
prune = true
jobs = 4
# autoadopt: add locally-found repos that are missing here into this file
autoadopt = true

